[package]
name = "vcm_listener"
version = "0.1.0"
edition = "2021"

[dependencies]
sherpa-onnx = "1.13.8"
cpal = "0.18"
rust-stemmers = "1.2"
odbc-api = "29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
