[package]
name = "my_slint_app"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
odbc-api = "8"
configparser = "3.3"

[build-dependencies]
slint-build = "1.3.2"
